name: Build ChatGPTEnhancer
# alpha48 requires both exact same-conversation request delivery and public-UIKit message-view rebuild evidence before Reload may report success
# project-chat header presentation may use the exact current menu title for the already-proven conversation ID; the synthetic title never becomes identity evidence
# alpha47 exact conversation/init identity and immutable current-menu targeting remain in force; the retired conversation-tool floating button stays removed
# manual reload still never falls back to History/sidebar/UIKit navigation or another conversation id

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chatgpt-enhancer-v0.1
    paths:
      - 'ChatGPTEnhancer/**'
      - '.github/workflows/build-enhancer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record workflow run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-enhancer-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-enhancer-run-id
          git diff --cached --quiet || git commit -m "ci: record enhancer build $GITHUB_RUN_ID [skip ci]"
          git push
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: bash ./ChatGPTEnhancer/build.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha48-reload-ui-title
          path: ChatGPTEnhancer/build/ChatGPTEnhancer-0.1.0-alpha48-reload-ui-title.zip
          if-no-files-found: error
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha48-reload-ui-title-dylib
          path: ChatGPTEnhancer/build/ChatGPTEnhancer.dylib
          if-no-files-found: error
