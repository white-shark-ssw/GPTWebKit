name: Build ChatGPTEnhancer
# alpha52 makes Sync/Reload handoff wording truthful and stops repeated exact-route delivery once same-ID request delivery is proven without UI rebuild
# alternate exact-current route delivery remains only for cases where no same-ID request was observed; no new refresh mechanism is guessed
# alpha51 HTTP 429 terminal handling, exact conversation identity, and alpha50 sidebar Rename/Markdown behavior remain unchanged
# project-header presentation and percentage work are out of scope

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chatgpt-enhancer-v0.1
    paths:
      - 'ChatGPTEnhancer/**'
      - '.github/workflows/build-enhancer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record workflow run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-enhancer-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-enhancer-run-id
          git diff --cached --quiet || git commit -m "ci: record enhancer build $GITHUB_RUN_ID [skip ci]"
          git push
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: bash ./ChatGPTEnhancer/build.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha52-sync-refresh-handoff
          path: ChatGPTEnhancer/build/ChatGPTEnhancer-0.1.0-alpha52-sync-refresh-handoff.zip
          if-no-files-found: error
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha52-sync-refresh-handoff-dylib
          path: ChatGPTEnhancer/build/ChatGPTEnhancer.dylib
          if-no-files-found: error