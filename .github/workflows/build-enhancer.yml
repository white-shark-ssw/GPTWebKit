name: Build ChatGPTEnhancer
# alpha55 passively traces public UINavigationController stack mutations during the existing user-started identity trace
# production Sync/Reload behavior remains alpha52+: truthful refresh status, delivery-aware route suppression, terminal 429 handling, exact identity, and sidebar actions
# no production navigation mutation, request replay, project-header work, or percentage work is added

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chatgpt-enhancer-v0.1
      - feat/conversation-recognition
    paths:
      - 'ChatGPTEnhancer/**'
      - '.github/workflows/build-enhancer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record workflow run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-enhancer-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-enhancer-run-id
          git diff --cached --quiet || git commit -m "ci: record enhancer build $GITHUB_RUN_ID [skip ci]"
          git push
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: bash ./ChatGPTEnhancer/build.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha55-navigation-mutation-trace
          path: ChatGPTEnhancer/build/ChatGPTEnhancer-0.1.0-alpha55-navigation-mutation-trace.zip
          if-no-files-found: error
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha55-navigation-mutation-trace-dylib
          path: ChatGPTEnhancer/build/ChatGPTEnhancer.dylib
          if-no-files-found: error