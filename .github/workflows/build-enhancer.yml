name: Build ChatGPTEnhancer
# alpha47 promotes only explicit POST /backend-api/conversation/init body identity and freezes that exact ID into current-header menu actions
# current-conversation Pull / Reload / Export moved to the current chat menu; the old conversation-tool floating button is retired
# arbitrary UI/menu UUIDs and title-only matching are not current-conversation authority; Share remains validation-only
# alpha39 exact-current reload route delivery still never falls back to History/sidebar/UIKit or another conversation id

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chatgpt-enhancer-v0.1
      - feat/conversation-recognition
    paths:
      - 'ChatGPTEnhancer/**'
      - '.github/workflows/build-enhancer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record workflow run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-enhancer-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-enhancer-run-id
          git diff --cached --quiet || git commit -m "ci: record enhancer build $GITHUB_RUN_ID [skip ci]"
          git push
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: bash ./ChatGPTEnhancer/build.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha47-exact-menu-target
          path: ChatGPTEnhancer/build/ChatGPTEnhancer-0.1.0-alpha47-exact-menu-target.zip
          if-no-files-found: error
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha47-exact-menu-target-dylib
          path: ChatGPTEnhancer/build/ChatGPTEnhancer.dylib
          if-no-files-found: error
