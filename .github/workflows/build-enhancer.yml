name: Build ChatGPTEnhancer
# alpha43 stacks percentage accuracy/fail-closed fixes on alpha42 conversation recognition for combined real-device validation
# unknown conversation identity, payload mismatch, or unverified context capacity must display --% instead of a stale/invented percentage
# alpha42 project-header/current-conversation identity isolation remains enabled
# alpha39 exact-current reload behavior remains unchanged: no History/sidebar/UIKit fallback and no alternate conversation id

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chatgpt-enhancer-v0.1
    paths:
      - 'ChatGPTEnhancer/**'
      - '.github/workflows/build-enhancer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record workflow run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-enhancer-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-enhancer-run-id
          git diff --cached --quiet || git commit -m "ci: record enhancer build $GITHUB_RUN_ID [skip ci]"
          git push
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: bash ./ChatGPTEnhancer/build.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha43-conversation-usage
          path: ChatGPTEnhancer/build/ChatGPTEnhancer-0.1.0-alpha43-conversation-usage.zip
          if-no-files-found: error
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha43-conversation-usage-dylib
          path: ChatGPTEnhancer/build/ChatGPTEnhancer.dylib
          if-no-files-found: error
