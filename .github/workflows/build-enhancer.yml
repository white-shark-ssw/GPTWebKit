name: Build ChatGPTEnhancer
# alpha49 restores exact-ID Rename in the proven current-chat menu and searches visible foreground-scene windows for the real host UI surface
# Reload still requires exact same-conversation request delivery plus public-UIKit message-view rebuild evidence before success may be reported
# project-chat title remains presentation-only for an already-proven exact conversation ID and never becomes identity evidence
# interrupted-generation recovery is not changed without a pre-disconnect trace proving the host recovery lifecycle

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chatgpt-enhancer-v0.1
    paths:
      - 'ChatGPTEnhancer/**'
      - '.github/workflows/build-enhancer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record workflow run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-enhancer-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-enhancer-run-id
          git diff --cached --quiet || git commit -m "ci: record enhancer build $GITHUB_RUN_ID [skip ci]"
          git push
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: bash ./ChatGPTEnhancer/build.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha49-exact-rename-ui-target
          path: ChatGPTEnhancer/build/ChatGPTEnhancer-0.1.0-alpha49-exact-rename-ui-target.zip
          if-no-files-found: error
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha49-exact-rename-ui-target-dylib
          path: ChatGPTEnhancer/build/ChatGPTEnhancer.dylib
          if-no-files-found: error