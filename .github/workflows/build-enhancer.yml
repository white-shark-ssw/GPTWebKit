name: Build ChatGPTEnhancer
# alpha46 is an instrumentation-only candidate for persistent sanitized conversation/menu/share identity tracing; it does not change current action targeting behavior
# alpha45 keeps the floating tool entry visible independently of conversation identity while preserving fail-closed action-time verification
# alpha44 prevents observed background conversation requests from owning foreground identity and requires unique visible proof before pull/reload/export actions
# alpha39 exact-current reload behavior remains unchanged: no History/sidebar/UIKit fallback and no alternate conversation id

on:
  workflow_dispatch:
  push:
    branches:
      - feat/chatgpt-enhancer-v0.1
    paths:
      - 'ChatGPTEnhancer/**'
      - '.github/workflows/build-enhancer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record workflow run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-enhancer-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-enhancer-run-id
          git diff --cached --quiet || git commit -m "ci: record enhancer build $GITHUB_RUN_ID [skip ci]"
          git push
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: bash ./ChatGPTEnhancer/build.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha46-conversation-identity-trace
          path: ChatGPTEnhancer/build/ChatGPTEnhancer-0.1.0-alpha46-conversation-identity-trace.zip
          if-no-files-found: error
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTEnhancer-0.1.0-alpha46-conversation-identity-trace-dylib
          path: ChatGPTEnhancer/build/ChatGPTEnhancer.dylib
          if-no-files-found: error
