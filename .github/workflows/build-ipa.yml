name: Build IPA

on:
  push:
    branches:
      - feat/initial-ios-shell
      - feat/0.2-native-recovery-exporter
    paths-ignore:
      - .github/latest-run-id
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record workflow run id
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .github/latest-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-run-id
          git diff --cached --quiet || git commit -m "ci: record build run $GITHUB_RUN_ID [skip ci]"
          git push

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare app icon
        run: |
          test -f GPTWebKit/Assets.xcassets/AppIcon.appiconset/AppIcon-source.png
          sips -z 1024 1024 GPTWebKit/Assets.xcassets/AppIcon.appiconset/AppIcon-source.png --out GPTWebKit/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png >/dev/null

      - name: Build device app without signing
        run: |
          set -o pipefail
          rm -rf build Payload GPTWebKit-unsigned.ipa
          xcodebuild \
            -project GPTWebKit.xcodeproj \
            -scheme GPTWebKit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GPTWebKit.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ChatGPT-MD-0.3.0-alpha1.ipa
          ls -lh ChatGPT-MD-0.3.0-alpha1.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-MD-0.3.0-alpha1
          path: ChatGPT-MD-0.3.0-alpha1.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
