name: Build IPA

on:
  push:
    branches:
      - feat/initial-ios-shell
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate GPTWebKit app icon
        run: |
          python3 - <<'PY'
          import math
          from pathlib import Path
          size = 1024
          out = Path('GPTWebKit/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.ppm')
          out.parent.mkdir(parents=True, exist_ok=True)
          pixels = bytearray([255,255,255]) * (size * size)
          def setp(x,y,c):
              if 0 <= x < size and 0 <= y < size:
                  i=(y*size+x)*3; pixels[i:i+3]=bytes(c)
          cx=cy=size//2
          # Distinct GPTWebKit icon: black globe ring with a small web-view window.
          for y in range(size):
              for x in range(size):
                  dx=x-cx; dy=y-cy; r=math.hypot(dx,dy)
                  if 285 <= r <= 380: setp(x,y,(0,0,0))
                  if abs(dx) < 42 and r < 350: setp(x,y,(0,0,0))
                  if abs(dy) < 42 and r < 350: setp(x,y,(0,0,0))
                  if abs(r-215) < 28: setp(x,y,(0,0,0))
          # central white rounded-ish window cutout + black top bar
          for y in range(365,660):
              for x in range(310,714): setp(x,y,(255,255,255))
          for y in range(365,410):
              for x in range(310,714): setp(x,y,(0,0,0))
          with out.open('wb') as f:
              f.write(f'P6\n{size} {size}\n255\n'.encode())
              f.write(pixels)
          PY
          sips -s format png GPTWebKit/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.ppm --out GPTWebKit/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png >/dev/null
          rm GPTWebKit/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.ppm

      - name: Build device app without signing
        run: |
          set -o pipefail
          rm -rf build Payload GPTWebKit-unsigned.ipa
          xcodebuild \
            -project GPTWebKit.xcodeproj \
            -scheme GPTWebKit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GPTWebKit.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload GPTWebKit-unsigned.ipa
          ls -lh GPTWebKit-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GPTWebKit-unsigned-ipa
          path: GPTWebKit-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
